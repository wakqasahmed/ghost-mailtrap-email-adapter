name: Ghost 6 Integration

on:
  pull_request:
    paths:
      - 'MailtrapEmailProvider.js'
      - 'EmailProviderBase.js'
      - 'index.js'
      - 'package.json'
      - 'patches/**'
      - 'test/integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: bash test/integration/ghost-6.sh
